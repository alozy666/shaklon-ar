<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقات مدينة شكلون للطباعة</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/app.css">
<style>
  @page { size: A4 landscape; margin: 10mm; }
  html, body { height: auto; overflow: auto; background: #e9edfb; -webkit-user-select: text; user-select: text; }
  body { padding: 16px; color: #1f2a5a; }
  .bar { max-width: 277mm; margin: 0 auto 16px; background: #fff; border-radius: 18px; padding: 14px 20px; display: flex;
    gap: 16px; align-items: center; flex-wrap: wrap; box-shadow: 0 4px 14px rgba(16, 24, 64, .12); }
  .bar h1 { margin: 0; font-size: 24px; font-weight: 800; flex: 1 1 240px; }
  .bar p { margin: 0; font-size: 15px; color: #5b6590; flex: 1 1 100%; }
  .bar button { background: #f5a623; color: #fff; font-size: 20px; font-weight: 800; border-radius: 999px; padding: 10px 28px; }
  .warn { background: #fff1d6; border: 2px solid #f5a623; border-radius: 12px; padding: 8px 14px; font-weight: 700; color: #7a4b00; }
  code { direction: ltr; unicode-bidi: embed; font-size: 14px; background: #eef2ff; padding: 2px 8px; border-radius: 6px; }

  .card { width: 277mm; height: 190mm; margin: 0 auto 16px; background: #fff; border-radius: 8mm; padding: 8mm; display: grid;
    grid-template-columns: 1fr 172mm; grid-template-rows: auto 1fr auto; gap: 5mm 8mm; box-shadow: 0 4px 14px rgba(16, 24, 64, .12);
    break-after: page; break-inside: avoid; overflow: hidden; }
  .card header { grid-column: 1 / -1; display: flex; align-items: center; gap: 4mm; border-bottom: 1mm solid var(--c); padding-bottom: 3mm; }
  .card header img { width: 16mm; height: 16mm; }
  .card header h2 { margin: 0; font-size: 11mm; font-weight: 800; color: var(--c); line-height: 1.1; }
  .card header span { margin-inline-start: auto; background: var(--c); color: #fff; font-size: 6mm; font-weight: 800; padding: 1mm 6mm; border-radius: 99mm; }
  .how { display: grid; align-content: center; justify-items: center; gap: 4mm; text-align: center; }
  .qr { width: 58mm; height: 58mm; padding: 2mm; border: 1.2mm solid var(--c); border-radius: 5mm; background: #fff; }
  .qr svg { width: 100%; height: 100%; }
  .steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2.5mm; justify-items: start; }
  .steps-list li { display: flex; align-items: center; gap: 3mm; font-size: 6.4mm; font-weight: 800; }
  .steps-list b { flex: none; width: 10mm; height: 10mm; border-radius: 50%; background: #f5a623; color: #fff; display: grid; place-items: center; font-size: 6mm; }
  .target { width: 172mm; height: 129mm; align-self: center; border-radius: 4mm; display: block; }
  .card footer { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 6mm; font-size: 3.6mm; color: #5b6590; }
  .card footer code { font-size: 3.4mm; }

  @media screen and (max-width: 1100px) { .card { zoom: .62; } }
  @media print {
    html, body { background: #fff; }
    body { padding: 0; }
    .bar { display: none; }
    .card { box-shadow: none; margin: 0; border-radius: 0; padding: 0; width: 277mm; height: 188mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>بطاقات «مدينة شكلون» للطباعة</h1>
  <button onclick="print()">طباعة</button>
  <p>اطبع بالألوان على ورق A4 بالعرض، بالحجم الحقيقي (100%)، ويفضّل ورق غير لامع. لا تقصّ صورة البطاقة ولا تغطِّ جزءًا منها: الكاميرا تتعرف عليها كاملة.</p>
  <p id="base-note"></p>
</div>

<div id="cards"></div>

<script src="../vendor/qrcode.js"></script>
<script>
  // الرموز تُبنى من عنوان هذه الصفحة نفسها، فتطابق دائمًا المكان المنشورة فيه الأداة.
  // لتجربة عنوان آخر: ?base=https://example.com/shaklon-ar/
  const CARDS = [
    { key: 'city',     title: 'مدينة شكلون',   color: '#3f5fd8', use: 'للدرس' },
    { key: 'mystery',  title: 'المجسم الغامض', color: '#7b5bd6', use: 'للتحقق من الفهم' },
    { key: 'district', title: 'الحيّ الجديد',  color: '#17a589', use: 'للتقييم' },
  ];
  const params = new URLSearchParams(location.search);
  const base = params.get('base') || new URL('../', location.href).href;
  const local = /^(localhost|127\.0\.0\.1)$/.test(new URL(base).hostname);
  const note = document.getElementById('base-note');
  note.innerHTML = `الرموز تفتح: <code>${base}</code>` + (local
    ? ' <span class="warn">هذا عنوان محلي: الرموز لن تعمل على الأجهزة اللوحية. اطبع من الموقع المنشور.</span>' : '');

  document.getElementById('cards').innerHTML = CARDS.map((c, i) => {
    const url = `${base}?scene=${c.key}`;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return `
    <section class="card" style="--c:${c.color}">
      <header>
        <img src="../assets/icon.svg" alt="">
        <h2>${c.title}</h2>
        <span>بطاقة ${i + 1} · ${c.use}</span>
      </header>
      <div class="how">
        <div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>
        <ol class="steps-list">
          <li><b>1</b>امسح الرمز</li>
          <li><b>2</b>اضغط «ابدأ»</li>
          <li><b>3</b>وجّه الكاميرا إلى الصورة</li>
        </ol>
      </div>
      <img class="target" src="../assets/targets/card-${c.key}.png" alt="صورة التتبّع: ${c.title}">
      <footer>
        <span>ضع البطاقة مسطّحة على الطاولة في إضاءة جيدة، وأبقِ الصورة كلها أمام الكاميرا.</span>
        <code>${url}</code>
      </footer>
    </section>`;
  }).join('');
</script>
</body>
</html>
