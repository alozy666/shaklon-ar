<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18204a">
  <title>مدينة شكلون</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script async src="vendor/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/three-addons/",
      "mindar-image-three": "./vendor/mindar/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>

<!-- أيقونات مشتركة -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="shaklon" viewBox="0 0 64 64">
      <line x1="32" y1="7" x2="32" y2="17" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="7" r="4.5" fill="#F5A623"/>
      <rect x="3" y="26" width="8" height="13" rx="4" fill="#F5A623"/>
      <rect x="53" y="26" width="8" height="13" rx="4" fill="#F5A623"/>
      <rect x="9" y="16" width="46" height="33" rx="11" fill="#4F6FE3"/>
      <rect x="14" y="21" width="36" height="23" rx="8" fill="#E6ECFF"/>
      <circle cx="24" cy="31" r="6" fill="#fff"/><circle cx="40" cy="31" r="6" fill="#fff"/>
      <circle cx="24" cy="31.6" r="3" fill="#1F2A5A"/><circle cx="40" cy="31.6" r="3" fill="#1F2A5A"/>
      <rect x="26" y="39" width="12" height="2.6" rx="1.3" fill="#F5A623"/>
      <rect x="22" y="51" width="20" height="9" rx="4" fill="#3A55C4"/>
    </symbol>
    <symbol id="i-predict" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12.5" cy="9.5" rx="8" ry="6.5"/><path d="M10.4 8.2a2.2 2.2 0 1 1 3.3 1.9c-.8.5-1.2.9-1.2 1.7"/><circle cx="6" cy="18.3" r="1.5"/><circle cx="3.6" cy="21.4" r=".7"/></g><circle cx="12.5" cy="13.7" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20.3 3.6v4.6h-4.6"/></g><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-count" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.7 15.7L21 21"/><path d="M10.5 7.5v6M7.5 10.5h6"/></g></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7.8 12.4l2.9 2.9 5.6-6"/></g></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6.5 10v9.5h11V10"/></g></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M3.7 3.6v4.6h4.6"/></g></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 20h14"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></g></symbol>
    <symbol id="i-fog" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.6-1.2A4.6 4.6 0 0 1 17 17z"/></g><circle cx="12" cy="20.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11m0-1V5a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6c-2.4 0-3.7-1-5-3l-2-3.3a1.4 1.4 0 0 1 2.3-1.6L8 14"/></g></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L4 9l4 4"/><path d="M4 9h10a5.5 5.5 0 0 1 0 11h-3"/></g></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></g></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></g></symbol>
  </defs>
</svg>

<div id="stage"></div>

<div id="ui">
  <!-- شاشة البداية -->
  <section id="home" class="screen">
    <div class="home-card">
      <svg class="home-bot"><use href="#shaklon"/></svg>
      <h1 id="home-title">مدينة شكلون</h1>
      <p id="home-sub">ساعد شكلون في وصف مباني مدينته</p>
      <div id="home-scenes" class="home-scenes"></div>
      <button id="btn-start" class="big-btn" hidden>ابدأ</button>
      <button id="btn-3d" class="link-btn">افتح بدون كاميرا</button>
      <p class="home-foot"><span id="home-group"></span> <a href="teacher/">صفحة المعلم</a></p>
    </div>
  </section>

  <!-- واجهة المشهد -->
  <section id="hud" hidden>
    <header class="top">
      <button id="avatar" class="avatar" aria-label="شكلون"><svg><use href="#shaklon"/></svg></button>
      <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>
      <div class="tools">
        <button id="btn-sound" class="tool" aria-label="الصوت"><svg><use href="#i-sound"/></svg></button>
        <button id="btn-log" class="tool" aria-label="سجل المدينة" hidden><svg><use href="#i-list"/></svg></button>
        <button id="btn-reset" class="tool" aria-label="إعادة المشهد"><svg><use href="#i-reset"/></svg></button>
        <button id="btn-home" class="tool" aria-label="الرئيسية"><svg><use href="#i-home"/></svg></button>
      </div>
    </header>

    <div id="turn" class="turn" hidden></div>
    <div id="title-chip" class="title-chip" hidden></div>
    <div id="hint" class="hint" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <div class="side">
      <button id="btn-back" class="pill" hidden><svg><use href="#i-grid"/></svg><span>كل المباني</span></button>
      <button id="btn-lift" class="pill" hidden><svg><use href="#i-up"/></svg><span>ارفع المبنى</span></button>
      <button id="btn-exam" class="pill strong" hidden><svg><use href="#i-star"/></svg><span>مهمة المحقق</span></button>
      <button id="btn-bye" class="pill" hidden><svg><use href="#i-wave"/></svg><span>ودّع شكلون</span></button>
      <button id="btn-move" class="pill" hidden><svg><use href="#i-move"/></svg><span>انقل المدينة</span></button>
      <button id="btn-mat" class="pill" hidden><svg><use href="#i-grid"/></svg><span>على السجادة</span></button>
      <button id="btn-bigger" class="pill" hidden><svg><use href="#i-plus"/></svg><span>أكبر</span></button>
      <button id="btn-smaller" class="pill" hidden><svg><use href="#i-minus"/></svg><span>أصغر</span></button>
      <button id="btn-undo" class="pill" hidden><svg><use href="#i-undo"/></svg><span>تراجع</span></button>
      <button id="btn-again" class="pill" hidden><svg><use href="#i-camera"/></svg><span>صورة أخرى</span></button>
      <button id="btn-fresh" class="pill" hidden><svg><use href="#i-reset"/></svg><span>شيء جديد</span></button>
      <button id="btn-which" class="pill" hidden><svg><use href="#i-list"/></svg><span>أي مبنى يشبهه؟</span></button>
      <button id="btn-challenge" class="pill teacher" hidden><svg><use href="#i-fog"/></svg><span>المجسم الغامض</span></button>
      <button id="btn-all" class="pill teacher" hidden><svg><use href="#i-light"/></svg><span>أضئ الكل</span></button>
      <button id="btn-results" class="pill teacher" hidden><svg><use href="#i-list"/></svg><span>النتائج</span></button>
      <button id="btn-wipe" class="pill teacher" hidden><svg><use href="#i-reset"/></svg><span>مسح التقدّم</span></button>
    </div>

    <footer class="bottom">
      <div id="timer" class="timer" hidden><i></i></div>
      <div id="predict" class="panel predict" hidden>
        <div class="stepper" data-kind="faces"><i class="ico faces"></i><span>الأوجه</span><button data-d="-1" aria-label="أقل">−</button><b>؟</b><button data-d="1" aria-label="أكثر">+</button></div>
        <div class="stepper" data-kind="edges"><i class="ico edges"></i><span>الأحرف</span><button data-d="-1" aria-label="أقل">−</button><b>؟</b><button data-d="1" aria-label="أكثر">+</button></div>
        <div class="stepper" data-kind="vertices"><i class="ico vertices"></i><span>الرؤوس</span><button data-d="-1" aria-label="أقل">−</button><b>؟</b><button data-d="1" aria-label="أكثر">+</button></div>
      </div>
      <nav id="lenses" class="lenses" hidden>
        <button data-lens="faces"><i class="ico faces"></i><span>الأوجه</span><b>0</b></button>
        <button data-lens="edges"><i class="ico edges"></i><span>الأحرف</span><b>0</b></button>
        <button data-lens="vertices"><i class="ico vertices"></i><span>الرؤوس</span><b>0</b></button>
      </nav>
      <nav id="steps" class="steps" hidden>
        <button data-step="predict"><svg><use href="#i-predict"/></svg><span>أتوقع</span></button>
        <button data-step="walk"><svg><use href="#i-walk"/></svg><span>أتجوّل</span></button>
        <button data-step="count"><svg><use href="#i-count"/></svg><span>أعدّ</span></button>
        <button data-step="compare"><svg><use href="#i-compare"/></svg><span>أقارن</span></button>
      </nav>
      <button id="btn-next" class="big-btn" hidden><span>التالي</span></button>
      <button id="btn-shutter" class="shutter" hidden aria-label="التقط الصورة"><svg><use href="#i-camera"/></svg></button>
    </footer>

    <div id="compare" class="sheet" hidden>
      <h2>هل صدقت توقعاتنا؟</h2>
      <table class="tbl">
        <thead><tr><th></th><th>توقّعنا</th><th>عددنا</th><th></th></tr></thead>
        <tbody id="cmp-rows"></tbody>
      </table>
      <button id="btn-done" class="big-btn"><svg><use href="#i-light"/></svg><span>تمّ</span></button>
    </div>

    <div id="log" class="sheet" hidden>
      <h2>سجل المدينة</h2>
      <table class="tbl">
        <thead><tr><th>المبنى</th><th><i class="ico faces"></i>الأوجه</th><th><i class="ico edges"></i>الأحرف</th><th><i class="ico vertices"></i>الرؤوس</th></tr></thead>
        <tbody id="log-rows"></tbody>
      </table>
      <button id="btn-log-close" class="big-btn small">إغلاق</button>
    </div>
  </section>

  <!-- نافذة عامة: اختيار المجموعة، دور من، تسليم الجهاز، النتائج -->
  <section id="dialog" class="dialog" hidden>
    <div class="dialog-card">
      <svg id="dialog-bot" class="dialog-bot"><use href="#shaklon"/></svg>
      <h2 id="dialog-title"></h2>
      <p id="dialog-lead"></p>
      <div id="dialog-body"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>
  </section>

  <!-- انتظار ظهور الصورة المطبوعة أمام الكاميرا -->
  <section id="scan" class="scan" hidden>
    <div class="scan-frame"><span></span><span></span><span></span><span></span></div>
    <p id="scan-text"></p>
  </section>

  <section id="loading" class="loading" hidden><div class="spinner"></div><p>لحظة...</p></section>
  <canvas id="confetti"></canvas>
</div>

<script src="vendor/qrcode.js" defer></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
